<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SNAKING & SHAKING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; font-weight:700; touch-action:none; }
#game-container { position: relative; width:100%; max-width:600px; aspect-ratio:1/1; border:10px solid #006BB6; border-radius:0; overflow:hidden; background:none; }
#gameCanvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
canvas { width:100%; height:100%; display:block; background-color:#dcb18c; }
        .knicks-blue { background-color: #006BB6; }
        .knicks-orange { background-color: #F58426; }
        .knicks-silver { background-color: #BEC0C2; }
        #freeThrowMeter { width:40px; height:200px; background:#333; border:2px solid white; position:relative; border-radius:5px; }
        #meterIndicator { width:100%; height:5px; background:#F58426; position:absolute; left:0; }
        #makeZone { width:100%; height:30px; background:rgba(0,255,0,0.5); position:absolute; left:0; top:85px; }

        /* Lineup modal improvements for mobile */
        #lineupModal { position: fixed; inset: 0; width:100vw; height:100svh; background: #222 !important; margin:0; padding: env(safe-area-inset-top,16px) env(safe-area-inset-right,16px) env(safe-area-inset-bottom,16px) env(safe-area-inset-left,16px); box-sizing: border-box; font-family: 'Press Start 2P', cursive; text-transform: uppercase; overflow:auto; -webkit-overflow-scrolling: touch; }
        .player-card { display:flex; flex-direction:column; align-items:center; animation:fadeIn 0.5s ease-out forwards; opacity:0; min-width:80px; max-width:140px; text-align:center; }
        .player-card img { border:4px solid white; box-shadow:0 0 15px #F58426; width:80px; height:80px; object-fit:cover; }
        #lineupTitle { text-shadow:3px 3px #000; animation:pulse 1.5s infinite; }
        #marquee { width:100%; background:#F58426; color:#002D62; padding:10px 0; white-space:nowrap; box-shadow:0 0 15px black; transform:translateX(100%); }

        @keyframes marquee-scroll { 0%{ transform:translateX(100%);} 20%{ transform:translateX(0);} 80%{ transform:translateX(0);} 100%{ transform:translateX(-100%);} }
        @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.05);} 100%{transform:scale(1);} }
        @keyframes fadeIn { to{ opacity:1; transform:translateY(0);} }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-[100svh] p-4 overflow-hidden">

    <div class="w-full max-w-lg mx-auto text-center">
        <h1 class="text-xl md:text-2xl font-bold text-knicks-orange mb-1" style="font-family: 'Press Start 2P', cursive;">SNAKING & SHAKING</h1>
        <div class="flex justify-around items-center mb-4 p-2 knicks-blue rounded-lg text-xs sm:text-base">
            <div>ROUND: <span id="championshipLevel" class="text-knicks-orange">1</span></div>
            <div>SCORE: <span id="score" class="text-knicks-orange">0</span></div>
            <div>LOOSE BALLS: <span id="trophiesCollected" class="text-knicks-orange">0/16</span></div>
        </div>
        <div id="rival-display" class="text-knicks-silver h-6"></div>
    </div>

    <div id="game-container" class="relative w-full max-w-lg mx-auto rounded-lg overflow-hidden">
        <canvas id="gameCanvas" class="shadow-2xl"></canvas>
        
        <div id="gameOverModal" class="absolute inset-0 bg-black bg-opacity-70 flex-col items-center justify-center rounded-lg hidden z-10">
            <h2 class="text-4xl text-red-500 mb-4" style="font-family: 'Press Start 2P', cursive;">GAME OVER</h2>
            <p class="text-xl mb-6">Final Score: <span id="finalScore">0</span></p>
            <button id="restartButton" class="px-6 py-3 knicks-orange text-gray-900 font-bold rounded-lg shadow-md hover:bg-yellow-400 transition-colors">PLAY AGAIN</button>
        </div>

        <div id="freeThrowModal" class="absolute inset-0 bg-black bg-opacity-80 flex-col items-center justify-center rounded-lg hidden z-10">
            <h2 class="text-2xl text-knicks-orange mb-4">CLUTCH FREE THROWS</h2>
            <p class="text-sm text-center mb-2 text-knicks-silver">Make both to advance to the Finals!</p>
            <img id="playerImage" src="" class="w-24 h-24 rounded-full border-4 border-knicks-orange mb-4" alt="Player">
            <p id="playerName" class="text-xl mb-4"></p>
            <div id="freeThrowMeter"><div id="makeZone"></div><div id="meterIndicator"></div></div>
            <p class="text-xl mt-4">Made: <span id="shotsMade">0</span> / 2</p>
            <p class="text-sm mt-2 text-knicks-silver">Tap or Press Space to Shoot</p>
        </div>

        <div id="lineupModal" class="absolute inset-0 flex flex-col items-center justify-between rounded-lg hidden p-4 z-10">
            <h2 id="lineupTitle" class="text-2xl md:text-3xl text-knicks-orange mb-4 flex-shrink-0"></h2>
            <div class="flex-grow w-full flex items-center justify-center overflow-y-auto py-2">
                <div id="awayTeam" class="flex flex-wrap justify-center items-start gap-x-4 gap-y-6 px-2"></div>
            </div>
            <div id="marquee" class="w-full flex-shrink-0 mt-4"><span id="marqueeText"></span></div>
        </div>

    </div>

    <script>
        // --- DOM Elements ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const championshipLevelEl = document.getElementById('championshipLevel');
        const trophiesCollectedEl = document.getElementById('trophiesCollected');
        const rivalDisplayEl = document.getElementById('rival-display');
        const gameOverModal = document.getElementById('gameOverModal');
        const finalScoreEl = document.getElementById('finalScore');
        const restartButton = document.getElementById('restartButton');
        const freeThrowModal = document.getElementById('freeThrowModal');
        const meterIndicator = document.getElementById('meterIndicator');
        const makeZone = document.getElementById('makeZone');
        const shotsMadeEl = document.getElementById('shotsMade');
        const playerImageEl = document.getElementById('playerImage');
        const playerNameEl = document.getElementById('playerName');
        const lineupModal = document.getElementById('lineupModal');
        const lineupTitleEl = document.getElementById('lineupTitle');
        const awayTeamEl = document.getElementById('awayTeam');
        const marqueeEl = document.getElementById('marquee');
        const marqueeTextEl = document.getElementById('marqueeText');

        // --- Config & state omitted for brevity in PR description ---
        // The PR will replace the file in full; keep the rest of the original script intact except for the showLineupScreen adjustments described.
    </script>
</body>
</html>
